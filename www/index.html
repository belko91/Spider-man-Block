<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spider-Man & Avengers: Block Blast</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for fallback icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Comic Style Header -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #fff;
            overflow-x: hidden;
        }
        .comic-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
        }
        
        /* Grid styling */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
            background-color: #1a2238;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(226, 54, 54, 0.25), inset 0 0 15px rgba(0,0,0,0.8);
            border: 3px solid #e23636;
            position: relative;
        }
        
        /* Highlight subgrids visually */
        .grid-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            background-color: #0d1322;
            transition: background-color 0.15s ease, transform 0.1s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid-cell.subgrid-alt {
            background-color: #141c30;
        }
        .grid-cell.hover-valid {
            background-color: rgba(34, 197, 94, 0.45) !important;
            box-shadow: inset 0 0 8px #22c55e;
        }
        .grid-cell.hover-invalid {
            background-color: rgba(239, 68, 68, 0.45) !important;
            box-shadow: inset 0 0 8px #ef4444;
        }
        
        /* Block Base Classes */
        .cell-filled {
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        /* Specific Theme Colors */
        .cell-filled-red { 
            background: linear-gradient(135deg, #ef4444, #991b1b); 
            border: 1px solid #fca5a5; 
        }
        .cell-filled-blue { 
            background: linear-gradient(135deg, #2563eb, #1e3a8a); 
            border: 1px solid #93c5fd; 
        }
        .cell-filled-green { 
            background: linear-gradient(135deg, #16a34a, #14532d); 
            border: 1px solid #86efac; 
        }
        .cell-filled-purple { 
            background: linear-gradient(135deg, #9333ea, #581c87); 
            border: 1px solid #d8b4fe; 
        }
        .cell-filled-gold { 
            background: linear-gradient(135deg, #eab308, #713f12); 
            border: 1px solid #fef08a; 
        }

        /* Block Icon Styling */
        .block-icon {
            width: 70%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Dragging styles */
        .piece-container {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26, 34, 56, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: grab;
            transition: transform 0.2s;
        }
        .piece-container:active {
            cursor: grabbing;
        }
        .piece-container.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        /* Shaking animation for Hulk smash */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-10px, 8px) rotate(-1.5deg); }
            20%, 40%, 60%, 80% { transform: translate(10px, -8px) rotate(1.5deg); }
        }
        .shake-effect {
            animation: shake 0.6s ease-in-out;
        }

        /* Comic Banner Popup Animation */
        @keyframes bannerPop {
            0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            80% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.9) rotate(0deg); opacity: 0; }
        }
        .banner-pop {
            animation: bannerPop 1.8s forwards ease-out;
        }

        /* Floating Overlay Canvas for Hero FX */
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }
        #heroCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-2 md:p-4 select-none">

    <!-- Hero Canvas Fullscreen overlay for Hero Entrances -->
    <canvas id="heroCanvas"></canvas>

    <!-- Header / Scoreboard -->
    <header class="w-full max-w-md flex flex-col items-center mb-2">
        <div class="flex items-center justify-between w-full mb-1">
            <h1 class="text-3xl sm:text-4xl comic-font text-red-500 tracking-wider flex items-center gap-2 drop-shadow-[0_2px_10px_rgba(239,68,68,0.8)]">
                <i class="fa-solid font-bold fa-spider text-red-500"></i> SPIDER-BLAST
            </h1>
            <button id="soundToggle" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 p-2.5 rounded-full border border-yellow-500/30 transition">
                <i class="fa-solid fa-volume-high text-lg" id="soundIcon"></i>
            </button>
        </div>
        
        <!-- Score Bar -->
        <div class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 flex justify-around items-center shadow-lg">
            <div class="text-center">
                <span class="text-xs uppercase tracking-wider text-slate-400 block font-semibold">PUNTEGGIO</span>
                <span id="scoreText" class="text-2xl sm:text-3xl font-extrabold text-amber-400 comic-font tracking-wide">0</span>
            </div>
            <div class="h-8 w-[1px] bg-slate-700"></div>
            <div class="text-center">
                <span class="text-xs uppercase tracking-wider text-slate-400 block font-semibold">RECORD</span>
                <span id="highScoreText" class="text-2xl sm:text-3xl font-extrabold text-blue-400 comic-font tracking-wide">0</span>
            </div>
            <div class="h-8 w-[1px] bg-slate-700"></div>
            <div class="text-center">
                <span class="text-xs uppercase tracking-wider text-slate-400 block font-semibold">COMBO</span>
                <span id="comboText" class="text-2xl sm:text-3xl font-extrabold text-emerald-400 comic-font tracking-wide">x1</span>
            </div>
        </div>
    </header>

    <!-- Game Board Container -->
    <main class="relative w-full max-w-md flex flex-col items-center my-auto">
        <!-- Banner Popup Container for Super Hero Callouts -->
        <div id="bannerOverlay" class="absolute inset-0 z-30 pointer-events-none flex items-center justify-center hidden">
            <div id="bannerText" class="comic-font text-4xl sm:text-6xl text-center font-black px-6 py-3 rounded-2xl border-4 shadow-2xl tracking-widest banner-pop">
                SPIDER-MAN!
            </div>
        </div>

        <div id="boardWrapper" class="relative w-full aspect-square">
            <div id="board" class="board-grid w-full h-full">
                <!-- 9x9 cells injected dynamically -->
            </div>
            <!-- In-board Effect Canvas -->
            <canvas id="fxCanvas"></canvas>
        </div>

        <!-- Available Pieces Tray -->
        <div class="w-full grid grid-cols-3 gap-3 mt-4" id="piecesTray">
            <div class="piece-container p-2" data-index="0"></div>
            <div class="piece-container p-2" data-index="1"></div>
            <div class="piece-container p-2" data-index="2"></div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-500">
        Trascina i blocchi Marvel sulla griglia 9x9! Evoca Spider-Man, Iron Man, Thor & Hulk!
    </footer>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border-2 border-purple-600 rounded-2xl p-6 text-center max-w-sm w-full shadow-[0_0_40px_rgba(147,51,234,0.5)] transform transition-all scale-95 opacity-0" id="modalCard">
            <div class="text-6xl mb-2">🎃</div>
            <h2 class="comic-font text-4xl text-green-400 mb-1 tracking-wider">GAME OVER!</h2>
            <p class="text-purple-300 font-medium mb-4 text-sm">Green Goblin ha lanciato una Zucca sulla griglia!</p>
            
            <div class="bg-slate-800/80 rounded-xl p-4 mb-6 border border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm">Punteggio Finale:</span>
                    <span id="finalScore" class="text-2xl font-bold text-amber-400 comic-font">0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm">Miglior Punteggio:</span>
                    <span id="finalHighScore" class="text-2xl font-bold text-blue-400 comic-font">0</span>
                </div>
            </div>

            <button id="restartBtn" class="w-full py-3 px-6 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold comic-font text-2xl tracking-widest rounded-xl shadow-lg hover:shadow-red-500/50 transition transform hover:-translate-y-0.5 active:translate-y-0">
                GIOCA ANCORA
            </button>
        </div>
    </div>

    <script>
        /**
         * MARVEL SVG ICONS ENGINE
         * Generates vector elements inside themed blocks
         */
        const MARVEL_ICONS = {
            // Red: Spider-Man Mask
            'cell-filled-red': `<svg viewBox="0 0 24 24" class="block-icon" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2C6.5 2 3 6 3 12c0 5 3.5 9.5 9 10 5.5-.5 9-5 9-10 0-6-3.5-10-9-10z" fill="#dc2626" stroke="#fca5a5"/>
                <path d="M12 2v20M3 12h18M5 6l14 12M5 18L19 6" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
                <path d="M7 8c2 2 3 5 3 5s-3 1-5-1c-2-2-1-5 2-4z" fill="#ffffff" stroke="#000"/>
                <path d="M17 8c-2 2-3 5-3 5s3 1 5-1c2-2 1-5-2-4z" fill="#ffffff" stroke="#000"/>
            </svg>`,

            // Blue: Captain America Shield
            'cell-filled-blue': `<svg viewBox="0 0 24 24" class="block-icon">
                <circle cx="12" cy="12" r="10" fill="#dc2626"/>
                <circle cx="12" cy="12" r="7.5" fill="#ffffff"/>
                <circle cx="12" cy="12" r="5" fill="#2563eb"/>
                <polygon points="12,7.5 13.2,10.5 16,10.5 13.7,12.3 14.5,15.2 12,13.3 9.5,15.2 10.3,12.3 8,10.5 10.8,10.5" fill="#ffffff"/>
            </svg>`,

            // Green: Hulk Fist
            'cell-filled-green': `<svg viewBox="0 0 24 24" class="block-icon" fill="#15803d" stroke="#86efac" stroke-width="1.5">
                <path d="M5 11c-1 0-2 1-2 2.5s1 2.5 2 2.5h1v3h10v-3h1c1 0 2-1 2-2.5S18 11 17 11H5z"/>
                <rect x="6" y="7" width="3" height="5" rx="1.5" fill="#22c55e"/>
                <rect x="9.5" y="6" width="3" height="6" rx="1.5" fill="#22c55e"/>
                <rect x="13" y="6.5" width="3" height="5.5" rx="1.5" fill="#22c55e"/>
                <rect x="16.5" y="8" width="2.5" height="4" rx="1.2" fill="#22c55e"/>
            </svg>`,

            // Purple: Hawkeye Bow & Arrow
            'cell-filled-purple': `<svg viewBox="0 0 24 24" class="block-icon" stroke="#e9d5ff" stroke-width="2" fill="none">
                <path d="M5 19C10 17 17 10 19 5" stroke="#a855f7" stroke-width="3"/>
                <line x1="5" y1="19" x2="19" y2="5" stroke="#f472b6" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="6" y1="6" x2="18" y2="18" stroke="#ffffff" stroke-width="2"/>
                <polygon points="18,18 18,14 14,18" fill="#ffffff"/>
            </svg>`,

            // Yellow: Thor Mjolnir Hammer
            'cell-filled-gold': `<svg viewBox="0 0 24 24" class="block-icon">
                <rect x="7" y="5" width="10" height="7" rx="1.5" fill="#94a3b8" stroke="#fef08a" stroke-width="1.5"/>
                <rect x="11" y="12" width="2" height="9" fill="#78350f" rx="0.5"/>
                <line x1="8" y1="5" x2="8" y2="12" stroke="#64748b" stroke-width="1"/>
                <line x1="16" y1="5" x2="16" y2="12" stroke="#64748b" stroke-width="1"/>
                <path d="M12 2v3M9 2l2 3M15 2l-2 3" stroke="#38bdf8" stroke-width="1.5"/>
            </svg>`
        };

        /**
         * Web Audio Synthesizer (No external audio files required)
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPlace() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(320, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playWebThwip() { // Spider-Man
                if (this.muted) return;
                this.init();
                const bufferSize = this.ctx.sampleRate * 0.15;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.18);
                filter.Q.value = 3;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playLaser() { // Iron Man Repulsor
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            playThunder() { // Thor Mjolnir Strike
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.7);
                gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.7);
            }

            playSmash() { // Hulk Smash
                if (this.muted) return;
                this.init();
                const bufferSize = this.ctx.sampleRate * 0.6;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.6);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playGoblinCackle() { // Green Goblin Pumpkin Bomb Cackle
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(750, this.ctx.currentTime + 0.25);
                osc.frequency.linearRampToValueAtTime(300, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.55);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.55);
                setTimeout(() => this.playSmash(), 350);
            }
        }

        const audio = new SoundFX();

        // Block Shapes Templates (Tetris / Block Blast shapes)
        const SHAPES = [
            // Single & Dots
            { matrix: [[1]], color: 'cell-filled-red' },
            // 2-blocks
            { matrix: [[1, 1]], color: 'cell-filled-blue' },
            { matrix: [[1], [1]], color: 'cell-filled-blue' },
            // 3-blocks
            { matrix: [[1, 1, 1]], color: 'cell-filled-gold' },
            { matrix: [[1], [1], [1]], color: 'cell-filled-gold' },
            { matrix: [[1, 1], [1, 0]], color: 'cell-filled-purple' },
            // 4-blocks L & Square
            { matrix: [[1, 1], [1, 1]], color: 'cell-filled-green' },
            { matrix: [[1, 1, 1, 1]], color: 'cell-filled-red' },
            { matrix: [[1], [1], [1], [1]], color: 'cell-filled-red' },
            { matrix: [[1, 0], [1, 0], [1, 1]], color: 'cell-filled-blue' },
            { matrix: [[1, 1, 1], [0, 1, 0]], color: 'cell-filled-purple' },
            // 3x3 Big Block & Corners
            { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'cell-filled-gold' },
            { matrix: [[1, 1], [0, 1]], color: 'cell-filled-green' },
            { matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], color: 'cell-filled-red' }
        ];

        // Game State Variables
        const BOARD_SIZE = 9;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let currentScore = 0;
        let highScore = parseInt(localStorage.getItem('spidey_block_highscore') || '0', 10);
        let comboCounter = 0;
        let currentTrayPieces = [null, null, null];
        let activeDrag = null;

        // Canvas Elements
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        const heroCanvas = document.getElementById('heroCanvas');
        const heroCtx = heroCanvas.getContext('2d');

        // Init Setup
        window.addEventListener('load', () => {
            resizeCanvases();
            initBoard();
            updateScoreUI();
            spawnNewPiecesTray();
            setupDragAndDrop();
        });

        window.addEventListener('resize', resizeCanvases);

        function resizeCanvases() {
            const boardWrapper = document.getElementById('boardWrapper');
            fxCanvas.width = boardWrapper.clientWidth;
            fxCanvas.height = boardWrapper.clientHeight;

            heroCanvas.width = window.innerWidth;
            heroCanvas.height = window.innerHeight;
        }

        // Initialize 9x9 HTML Board Grid
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    const subGridRow = Math.floor(r / 3);
                    const subGridCol = Math.floor(c / 3);
                    if ((subGridRow + subGridCol) % 2 === 1) {
                        cell.classList.add('subgrid-alt');
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        // Render Board State with Marvel Vector Graphics
        function renderBoard() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = getCellEl(r, c);
                    const subGridRow = Math.floor(r / 3);
                    const subGridCol = Math.floor(c / 3);
                    const isAlt = (subGridRow + subGridCol) % 2 === 1;

                    cell.className = `grid-cell ${isAlt ? 'subgrid-alt' : ''}`;
                    cell.innerHTML = '';

                    const colorClass = boardState[r][c];
                    if (colorClass) {
                        cell.classList.add('cell-filled', colorClass);
                        if (MARVEL_ICONS[colorClass]) {
                            cell.innerHTML = MARVEL_ICONS[colorClass];
                        }
                    }
                }
            }
        }

        function getCellEl(r, c) {
            return document.querySelector(`.grid-cell[data-row="${r}"][data-col="${c}"]`);
        }

        // Spawn Pieces in Bottom Tray
        function spawnNewPiecesTray() {
            for (let i = 0; i < 3; i++) {
                if (!currentTrayPieces[i]) {
                    const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                    currentTrayPieces[i] = JSON.parse(JSON.stringify(randomShape));
                }
                renderPieceInTray(i);
            }
            checkGameOverCondition();
        }

        function renderPieceInTray(index) {
            const container = document.querySelector(`.piece-container[data-index="${index}"]`);
            container.innerHTML = '';
            const piece = currentTrayPieces[index];
            if (!piece) {
                container.classList.add('disabled');
                return;
            }
            container.classList.remove('disabled');

            const grid = document.createElement('div');
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = `repeat(${piece.matrix[0].length}, 1fr)`;
            grid.style.gap = '3px';

            for (let r = 0; r < piece.matrix.length; r++) {
                for (let c = 0; c < piece.matrix[0].length; c++) {
                    const block = document.createElement('div');
                    block.style.width = '22px';
                    block.style.height = '22px';
                    block.style.borderRadius = '3px';
                    block.style.display = 'flex';
                    block.style.alignItems = 'center';
                    block.style.justifyContent = 'center';

                    if (piece.matrix[r][c]) {
                        block.className = `cell-filled ${piece.color}`;
                        if (MARVEL_ICONS[piece.color]) {
                            block.innerHTML = MARVEL_ICONS[piece.color];
                        }
                    } else {
                        block.style.opacity = '0';
                    }
                    grid.appendChild(block);
                }
            }
            container.appendChild(grid);
        }

        // Drag & Drop Handling
        function setupDragAndDrop() {
            const containers = document.querySelectorAll('.piece-container');
            
            containers.forEach(container => {
                container.addEventListener('mousedown', (e) => startDrag(e, container));
                container.addEventListener('touchstart', (e) => startDrag(e, container), { passive: false });
            });

            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('touchmove', onDragMove, { passive: false });
            window.addEventListener('mouseup', onDragEnd);
            window.addEventListener('touchend', onDragEnd);
        }

        function startDrag(e, container) {
            const index = parseInt(container.dataset.index, 10);
            const piece = currentTrayPieces[index];
            if (!piece) return;

            audio.init();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dragAvatar = container.cloneNode(true);
            dragAvatar.style.position = 'fixed';
            dragAvatar.style.pointerEvents = 'none';
            dragAvatar.style.zIndex = '1000';
            dragAvatar.style.opacity = '0.95';
            dragAvatar.style.transform = 'scale(1.25) translate(-50%, -100%)';
            dragAvatar.style.left = `${clientX}px`;
            dragAvatar.style.top = `${clientY}px`;
            document.body.appendChild(dragAvatar);

            activeDrag = {
                index: index,
                piece: piece,
                avatar: dragAvatar,
                startX: clientX,
                startY: clientY
            };
        }

        function onDragMove(e) {
            if (!activeDrag) return;
            if (e.cancelable) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            activeDrag.avatar.style.left = `${clientX}px`;
            activeDrag.avatar.style.top = `${clientY}px`;

            const boardWrapper = document.getElementById('boardWrapper');
            const rect = boardWrapper.getBoundingClientRect();
            const hoverX = clientX;
            const hoverY = clientY - 50; 

            clearHighlights();

            if (hoverX >= rect.left && hoverX <= rect.right && hoverY >= rect.top && hoverY <= rect.bottom) {
                const cellSize = rect.width / BOARD_SIZE;
                const col = Math.floor((hoverX - rect.left) / cellSize);
                const row = Math.floor((hoverY - rect.top) / cellSize);

                if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE) {
                    const valid = canPlacePiece(activeDrag.piece.matrix, row, col);
                    highlightCells(activeDrag.piece.matrix, row, col, valid);
                }
            }
        }

        function onDragEnd(e) {
            if (!activeDrag) return;

            const avatar = activeDrag.avatar;
            const rect = document.getElementById('boardWrapper').getBoundingClientRect();
            const clientX = parseFloat(avatar.style.left);
            const clientY = parseFloat(avatar.style.top) - 50;

            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                const cellSize = rect.width / BOARD_SIZE;
                const col = Math.floor((clientX - rect.left) / cellSize);
                const row = Math.floor((clientY - rect.top) / cellSize);

                if (canPlacePiece(activeDrag.piece.matrix, row, col)) {
                    placePiece(activeDrag.piece, row, col, activeDrag.index);
                }
            }

            if (avatar && avatar.parentNode) {
                avatar.parentNode.removeChild(avatar);
            }
            clearHighlights();
            activeDrag = null;
        }

        function canPlacePiece(matrix, startRow, startCol) {
            const rows = matrix.length;
            const cols = matrix[0].length;

            if (startRow + rows > BOARD_SIZE || startCol + cols > BOARD_SIZE) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (matrix[r][c] === 1) {
                        if (boardState[startRow + r][startCol + c] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function highlightCells(matrix, startRow, startCol, isValid) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c] === 1) {
                        const targetRow = startRow + r;
                        const targetCol = startCol + c;
                        if (targetRow < BOARD_SIZE && targetCol < BOARD_SIZE) {
                            const cell = getCellEl(targetRow, targetCol);
                            if (cell) cell.classList.add(isValid ? 'hover-valid' : 'hover-invalid');
                        }
                    }
                }
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.grid-cell').forEach(cell => {
                cell.classList.remove('hover-valid', 'hover-invalid');
            });
        }

        function placePiece(piece, startRow, startCol, trayIndex) {
            let placedCount = 0;
            for (let r = 0; r < piece.matrix.length; r++) {
                for (let c = 0; c < piece.matrix[0].length; c++) {
                    if (piece.matrix[r][c] === 1) {
                        boardState[startRow + r][startCol + c] = piece.color;
                        placedCount++;
                    }
                }
            }

            audio.playPlace();
            currentScore += placedCount * 10;
            currentTrayPieces[trayIndex] = null;
            renderBoard();
            renderPieceInTray(trayIndex);

            checkClears();

            if (currentTrayPieces.every(p => p === null)) {
                spawnNewPiecesTray();
            } else {
                checkGameOverCondition();
            }
        }

        // Line and 3x3 Clear Evaluation Logic
        function checkClears() {
            const rowsToClear = [];
            const colsToClear = [];
            const subgridsToClear = [];

            // 1. Horizontal Lines
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (boardState[r].every(cell => cell !== null)) {
                    rowsToClear.push(r);
                }
            }

            // 2. Vertical Lines
            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (boardState[r][c] === null) { full = false; break; }
                }
                if (full) colsToClear.push(c);
            }

            // 3. 3x3 Subgrids
            for (let sgR = 0; sgR < 3; sgR++) {
                for (let sgC = 0; sgC < 3; sgC++) {
                    let full = true;
                    for (let r = sgR * 3; r < sgR * 3 + 3; r++) {
                        for (let c = sgC * 3; c < sgC * 3 + 3; c++) {
                            if (boardState[r][c] === null) { full = false; break; }
                        }
                    }
                    if (full) subgridsToClear.push({ r: sgR, c: sgC });
                }
            }

            const totalClears = rowsToClear.length + colsToClear.length + subgridsToClear.length;
            const has3x3Cleared = subgridsToClear.length > 0;

            if (totalClears > 0) {
                comboCounter++;
                const basePoints = (rowsToClear.length * 9 + colsToClear.length * 9 + subgridsToClear.length * 9) * 10;
                currentScore += basePoints * comboCounter;
                updateScoreUI();

                triggerHeroSequence(totalClears, has3x3Cleared, rowsToClear, colsToClear, subgridsToClear);
            } else {
                comboCounter = 0;
                updateScoreUI();
            }
        }

        // Trigger Animations depending on lines cleared
        function triggerHeroSequence(clearedCount, has3x3, rows, cols, subgrids) {
            const executeCellClearing = () => {
                rows.forEach(r => { for (let c = 0; c < BOARD_SIZE; c++) boardState[r][c] = null; });
                cols.forEach(c => { for (let r = 0; r < BOARD_SIZE; r++) boardState[r][c] = null; });
                subgrids.forEach(sg => {
                    for (let r = sg.r * 3; r < sg.r * 3 + 3; r++) {
                        for (let c = sg.c * 3; c < sg.c * 3 + 3; c++) boardState[r][c] = null;
                    }
                });
                renderBoard();
            };

            // Rule 4: Hulk (4+ Lines OR 3x3 grid)
            if (clearedCount >= 4 || has3x3) {
                showBanner("HULK SMASH!", "bg-green-700 text-green-200 border-green-400 shadow-green-500/50");
                animateHulkEntrance(() => executeCellClearing());
            }
            // Rule 3: Thor (3 Lines)
            else if (clearedCount === 3) {
                showBanner("THOR: STRIKE!", "bg-cyan-700 text-cyan-200 border-cyan-300 shadow-cyan-500/50");
                animateThorEntrance(() => executeCellClearing());
            }
            // Rule 2: Iron Man (2 Lines)
            else if (clearedCount === 2) {
                showBanner("IRON MAN: UNIBEAM!", "bg-red-800 text-yellow-300 border-yellow-500 shadow-yellow-500/50");
                animateIronManEntrance(rows, cols, () => executeCellClearing());
            }
            // Rule 1: Spider-Man (1 Line)
            else if (clearedCount === 1) {
                showBanner("SPIDER-MAN!", "bg-red-700 text-blue-200 border-red-400 shadow-red-500/50");
                animateSpiderManEntrance(rows, cols, () => executeCellClearing());
            }
        }

        function showBanner(text, styleClasses) {
            const overlay = document.getElementById('bannerOverlay');
            const bannerText = document.getElementById('bannerText');
            
            bannerText.textContent = text;
            bannerText.className = `comic-font text-3xl sm:text-5xl text-center font-black px-6 py-3 rounded-2xl border-4 shadow-2xl tracking-widest banner-pop ${styleClasses}`;
            
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.add('hidden'); }, 1700);
        }

        // ====================================================
        // FULL HERO ENTRANCE CANVAS ANIMATIONS ENGINE
        // ====================================================

        // Helper: Draw Full Body Character Silhouette Vectors
        function drawHeroCharacter(ctx, x, y, type, scale = 1, state = {}) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            if (type === 'spiderman') {
                // Spider-Man Full Body crouching / web swinging pose
                ctx.fillStyle = '#dc2626'; // Red Body
                ctx.beginPath();
                ctx.arc(0, -35, 18, 0, Math.PI * 2); // Head
                ctx.fill();
                // Mask Eyes
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(-6, -37, 5, 8, Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(6, -37, 5, 8, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                // Torso & Suit details
                ctx.fillStyle = '#2563eb'; // Blue arms & legs
                ctx.fillRect(-15, -17, 30, 30);
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(-8, -17, 16, 30);
                // Web lines on chest
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.strokeRect(-8, -17, 16, 30);
            }
            else if (type === 'ironman') {
                // Iron Man Armor Full Body
                ctx.fillStyle = '#b91c1c'; // Red armor
                ctx.fillRect(-16, -55, 32, 22); // Helmet
                ctx.fillStyle = '#eab308'; // Golden faceplate
                ctx.fillRect(-10, -50, 20, 14);
                // Glowing eyes
                ctx.fillStyle = '#67e8f9';
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 10;
                ctx.fillRect(-8, -46, 5, 3);
                ctx.fillRect(3, -46, 5, 3);
                // Chest armor + Arc Reactor
                ctx.fillStyle = '#b91c1c';
                ctx.fillRect(-22, -30, 44, 40);
                ctx.fillStyle = '#67e8f9';
                ctx.beginPath();
                ctx.arc(0, -15, 8, 0, Math.PI * 2); // Arc reactor glow
                ctx.fill();
                // Thruster Thruster glow
                if (state.thrusters) {
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(-15, 20, 10, 0, Math.PI * 2);
                    ctx.arc(15, 20, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            else if (type === 'thor') {
                // Thor God of Thunder
                ctx.fillStyle = '#fde047'; // Golden Hair
                ctx.arc(0, -45, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#94a3b8'; // Silver Helmet
                ctx.fillRect(-14, -60, 28, 20);
                // Red Cape
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.moveTo(-30, -35);
                ctx.lineTo(-45, 40);
                ctx.lineTo(45, 40);
                ctx.lineTo(30, -35);
                ctx.fill();
                // Armor Body
                ctx.fillStyle = '#334155';
                ctx.fillRect(-20, -35, 40, 45);
                // Mjolnir Hammer in Hand
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(state.hammerUp ? 22 : -32, state.hammerUp ? -75 : -10, 18, 25);
            }
            else if (type === 'hulk') {
                // Massive Hulk Body
                ctx.fillStyle = '#15803d'; // Green skin
                ctx.beginPath();
                ctx.arc(0, -65, 28, 0, Math.PI * 2); // Head
                ctx.fill();
                ctx.fillStyle = '#166534'; // Muscle Torso
                ctx.fillRect(-45, -40, 90, 65);
                // Purple Pants
                ctx.fillStyle = '#7e22ce';
                ctx.fillRect(-40, 25, 80, 30);
                // Fists raised
                ctx.fillStyle = '#15803d';
                ctx.arc(-50, -20, 20, 0, Math.PI * 2);
                ctx.arc(50, -20, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            else if (type === 'goblin') {
                // Green Goblin Glider pose
                ctx.fillStyle = '#6b21a8'; // Purple Hood
                ctx.beginPath();
                ctx.arc(0, -45, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#22c55e'; // Green face
                ctx.fillRect(-12, -45, 24, 15);
                // Glider Wings
                ctx.fillStyle = '#475569';
                ctx.beginPath();
                ctx.moveTo(-70, 20);
                ctx.lineTo(0, -10);
                ctx.lineTo(70, 20);
                ctx.lineTo(0, 30);
                ctx.fill();
                // Fiery Glider Thruster
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.arc(0, 30, 15, 0, Math.PI * 2);
                ctx.fill();

            ctx.restore();

        // 1. Spider-Man Swing Entrance (1 Line)
        function animateSpiderManEntrance(rows, cols, onComplete) {
            audio.playWebThwip();
            let start = null;
            const duration = 1200;

            function step(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / duration;

                heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                const w = heroCanvas.width;
                const h = heroCanvas.height;

                const spideyX = Math.sin(progress * Math.PI) * (w * 0.7) + (w * 0.15);
                const spideyY = h * 0.35 + Math.sin(progress * Math.PI * 2) * 50;

                // Web Line attached top
                heroCtx.beginPath();
                heroCtx.moveTo(w * 0.5, 0);
                heroCtx.lineTo(spideyX, spideyY);
                heroCtx.strokeStyle = '#ffffff';
                heroCtx.lineWidth = 3;
                heroCtx.stroke();

                // Draw Full Spider-Man Character
                drawHeroCharacter(heroCtx, spideyX, spideyY, 'spiderman', 1.2);

                // Web Shoot effect over grid lines
                fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                fxCtx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                fxCtx.lineWidth = 3;

                rows.forEach(r => {
                    const y = (r + 0.5) * (fxCanvas.height / 9);
                    fxCtx.beginPath();
                    fxCtx.moveTo(0, y);
                    fxCtx.lineTo(fxCanvas.width, y);
                    fxCtx.stroke();
                });
                cols.forEach(c => {
                    const x = (c + 0.5) * (fxCanvas.width / 9);
                    fxCtx.beginPath();
                    fxCtx.moveTo(x, 0);
                    fxCtx.lineTo(x, fxCanvas.height);
                    fxCtx.stroke();
                });

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                    onComplete();
                }
            }
            requestAnimationFrame(step);
        }

        // 2. Iron Man Full Flying Entrance & Repulsor Blast (2 Lines)
        function animateIronManEntrance(rows, cols, onComplete) {
            audio.playLaser();
            let start = null;
            const duration = 1300;

            function step(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / duration;

                heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                const w = heroCanvas.width;
                const h = heroCanvas.height;

                // Fly in from bottom left to center
                const imX = Math.min(w * 0.22, progress * (w * 0.4));
                const imY = h * 0.45;

                // Draw Iron Man Full Body Character with Thrusters
                drawHeroCharacter(heroCtx, imX, imY, 'ironman', 1.3, { thrusters: true });

                // Unibeam Blast when reaching center spot
                if (progress > 0.3) {
                    const beamAlpha = Math.sin((progress - 0.3) * Math.PI * 1.4);
                    heroCtx.save();
                    heroCtx.strokeStyle = `rgba(103, 232, 249, ${beamAlpha})`;
                    heroCtx.lineWidth = 35;
                    heroCtx.shadowColor = '#06b6d4';
                    heroCtx.shadowBlur = 30;

                    heroCtx.beginPath();
                    heroCtx.moveTo(imX + 25, imY - 15);
                    heroCtx.lineTo(w, imY - 15);
                    heroCtx.stroke();
                    heroCtx.restore();
                }

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                    onComplete();
                }
            }
            requestAnimationFrame(step);
        }

        // 3. Thor Thunder Entrance & Mjolnir Strike (3 Lines)
        function animateThorEntrance(onComplete) {
            audio.playThunder();
            let start = null;
            const duration = 1400;

            function step(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / duration;

                heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                const w = heroCanvas.width;
                const h = heroCanvas.height;

                // Thor descends from sky center
                const thorX = w * 0.5;
                const thorY = Math.min(h * 0.3, progress * (h * 0.45));

                // Background lightning flash
                if (Math.random() > 0.3) {
                    heroCtx.fillStyle = 'rgba(56, 189, 248, 0.2)';
                    heroCtx.fillRect(0, 0, heroCanvas.width, heroCanvas.height);
                }

                // Lightning bolts hitting Thor's hammer
                heroCtx.strokeStyle = '#38bdf8';
                heroCtx.shadowColor = '#0284c7';
                heroCtx.shadowBlur = 20;
                heroCtx.lineWidth = 5;

                heroCtx.beginPath();
                let lx = thorX;
                let ly = 0;
                heroCtx.moveTo(lx, ly);
                while (ly < thorY) {
                    lx += (Math.random() - 0.5) * 50;
                    ly += 25;
                    heroCtx.lineTo(lx, ly);
                }
                heroCtx.stroke();

                // Draw Thor Character with Hammer Raised
                drawHeroCharacter(heroCtx, thorX, thorY, 'thor', 1.3, { hammerUp: true });

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                    onComplete();
                }
            }
            requestAnimationFrame(step);
        }

        // 4. Hulk Super Leap & Screen Smash Entrance (4+ Lines or 3x3 Grid)
        function animateHulkEntrance(onComplete) {
            audio.playSmash();
            const boardWrapper = document.getElementById('boardWrapper');
            boardWrapper.classList.add('shake-effect');

            let start = null;
            const duration = 1400;

            function step(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / duration;

                heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                const w = heroCanvas.width;
                const h = heroCanvas.height;

                // Leap Arc from Top to Screen Center
                const hulkX = w * 0.5;
                const leapHeight = Math.sin(progress * Math.PI) * 150;
                const hulkY = (h * 0.4) - leapHeight;

                // Draw Massive Hulk Character
                drawHeroCharacter(heroCtx, hulkX, hulkY, 'hulk', 1.5);

                // Shockwave on landing
                if (progress > 0.5) {
                    const waveRadius = (progress - 0.5) * (w * 0.9);
                    heroCtx.save();
                    heroCtx.strokeStyle = `rgba(34, 197, 94, ${1 - progress})`;
                    heroCtx.lineWidth = 18;
                    heroCtx.shadowColor = '#22c55e';
                    heroCtx.shadowBlur = 25;
                    heroCtx.beginPath();
                    heroCtx.arc(w / 2, h * 0.45, waveRadius, 0, Math.PI * 2);
                    heroCtx.stroke();
                    heroCtx.restore();
                }

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    boardWrapper.classList.remove('shake-effect');
                    heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                    onComplete();
                }
            }
            requestAnimationFrame(step);
        }

        // 5. Green Goblin Glider Entrance & Pumpkin Bomb Explosion (Game Over)
        function triggerGameOverSequence() {
            audio.playGoblinCackle();
            
            let start = null;
            const duration = 2200;

            function step(timestamp) {
                if (!start) start = timestamp;
                const progress = (timestamp - start) / duration;

                heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                const w = heroCanvas.width;
                const h = heroCanvas.height;

                // Green Goblin Glider flies in from left across screen
                const gobX = progress * (w * 1.3) - (w * 0.15);
                const gobY = h * 0.35 + Math.sin(progress * Math.PI * 3) * 40;

                // Draw Green Goblin Character on Glider
                drawHeroCharacter(heroCtx, gobX, gobY, 'goblin', 1.4);

                // Thrown Pumpkin Bomb falling to center screen
                if (progress > 0.3) {
                    const bombProg = (progress - 0.3) / 0.7;
                    const bombX = (w * 0.5);
                    const bombY = gobY + bombProg * (h * 0.25);

                    heroCtx.fillStyle = '#f97316';
                    heroCtx.shadowColor = '#ea580c';
                    heroCtx.shadowBlur = 15;
                    heroCtx.beginPath();
                    heroCtx.arc(bombX, bombY, 14, 0, Math.PI * 2);
                    heroCtx.fill();

                    // Green Pumpkin Smoke Trails
                    heroCtx.fillStyle = 'rgba(34, 197, 94, 0.5)';
                    heroCtx.arc(bombX - 5, bombY - 10, 8, 0, Math.PI * 2);
                    heroCtx.fill();
                }

                // Explosion at Screen Center
                if (progress > 0.75) {
                    const expScale = (progress - 0.75) * 4;
                    heroCtx.save();
                    heroCtx.fillStyle = `rgba(249, 115, 22, ${1.1 - progress})`;
                    heroCtx.shadowColor = '#ea580c';
                    heroCtx.shadowBlur = 40;
                    heroCtx.beginPath();
                    heroCtx.arc(w / 2, h / 2, expScale * 160, 0, Math.PI * 2);
                    heroCtx.fill();
                    heroCtx.restore();
                }

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    heroCtx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
                    showGameOverModal();
                }
            }
            requestAnimationFrame(step);
        }

        // Check if any piece can fit on board
        function checkGameOverCondition() {
            let possible = false;

            for (let i = 0; i < 3; i++) {
                const piece = currentTrayPieces[i];
                if (!piece) continue;

                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlacePiece(piece.matrix, r, c)) {
                            possible = true;
                            break;
                        }
                    }
                    if (possible) break;
                }
                if (possible) break;
            }

            if (!possible && currentTrayPieces.some(p => p !== null)) {
                setTimeout(() => {
                    triggerGameOverSequence();
                }, 400);
            }
        }

        function showGameOverModal() {
            const modal = document.getElementById('gameOverModal');
            const card = document.getElementById('modalCard');
            document.getElementById('finalScore').textContent = currentScore;
            document.getElementById('finalHighScore').textContent = highScore;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 50);
        }

        // Restart Game
        document.getElementById('restartBtn').addEventListener('click', () => {
            const modal = document.getElementById('gameOverModal');
            const card = document.getElementById('modalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                resetGame();
            }, 200);
        });

        function resetGame() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            currentScore = 0;
            comboCounter = 0;
            currentTrayPieces = [null, null, null];
            renderBoard();
            updateScoreUI();
            spawnNewPiecesTray();
        }

        function updateScoreUI() {
            document.getElementById('scoreText').textContent = currentScore;
            if (currentScore > highScore) {
                highScore = currentScore;
                localStorage.setItem('spidey_block_highscore', highScore.toString());
            }
            document.getElementById('highScoreText').textContent = highScore;
            document.getElementById('comboText').textContent = `x${Math.max(1, comboCounter)}`;
        }

        // Sound Mute Toggle Button
        document.getElementById('soundToggle').addEventListener('click', () => {
            audio.muted = !audio.muted;
            const soundIcon = document.getElementById('soundIcon');
            if (audio.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-lg text-slate-500';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-lg text-yellow-400';
                audio.playPlace();
            }
        });
    </script>
</body>
</html>
